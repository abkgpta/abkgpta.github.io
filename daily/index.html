<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abhik — Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --paper: #f7f2ef;
    --accent: #fb0068;
    --rule: rgba(247, 242, 239, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--black); color: var(--paper); }
  body {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.55;
  }
  .display { font-family: "Michroma", sans-serif; font-weight: 400; letter-spacing: 0.01em; }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
  }
  header {
    border-bottom: 1px solid var(--rule);
    padding: 40px 0 28px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 16px;
    align-items: end;
  }
  .name { font-family: "Michroma", sans-serif; font-size: 28px; margin: 0; }
  .name span { color: var(--accent); }
  .tagline { font-family: "Michroma", sans-serif; font-size: 14px; color: var(--accent); margin: 8px 0 0; }
  .date { font-size: 12px; opacity: 0.7; text-align: right; }

  .layout {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 40px;
    padding: 32px 0 64px;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    header { grid-template-columns: 1fr; }
    .date { text-align: left; }
  }

  h2 {
    font-family: "Michroma", sans-serif;
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--rule);
    color: var(--paper);
  }
  h2 .count { color: var(--accent); margin-left: 8px; }

  .topic { margin-bottom: 32px; }
  .topic-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .story {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px dashed var(--rule);
    color: var(--paper);
    text-decoration: none;
  }
  .story:last-child { border-bottom: 0; }
  .story:hover .story-title { color: var(--accent); }
  .story-img {
    width: 160px;
    height: 100px;
    object-fit: cover;
    display: block;
    background: #111;
  }
  @media (max-width: 520px) {
    .story { grid-template-columns: 1fr; }
    .story-img { width: 100%; height: 180px; }
  }
  .story-title { font-size: 14px; margin: 0 0 2px; }
  .source { font-size: 11px; opacity: 0.6; }

  .cal-item {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--rule);
  }
  .cal-time { color: var(--accent); font-size: 12px; }
  .cal-title { font-size: 13px; }
  .cal-day { font-family: "Michroma", sans-serif; font-size: 12px; margin: 18px 0 6px; opacity: 0.9; }
  .cal-day:first-child { margin-top: 0; }
  .empty { opacity: 0.6; font-size: 13px; }

  footer {
    border-top: 1px solid var(--rule);
    padding: 20px 0 40px;
    font-size: 11px;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="name">ABHIK<span>GUPTA</span></h1>
      <p class="tagline" id="quote"></p>
    </div>
    <div class="date" id="today"></div>
  </header>

  <div class="layout">
    <main>
      <div id="news"></div>
    </main>
    <aside>
      <h2>Calendar</h2>
      <div id="calendar"></div>
    </aside>
  </div>

  <footer>
    Headlines are linked to their source. Snapshot taken 25 Oct 2026; re-run the daily update to refresh.
  </footer>
</div>

<script>
  // ---- Data: update daily ----
  const NEWS = [
    {
      topic: "Startups & Indian startups",
      stories: [
        { title: "From Navi To BookMyShow — Indian Startups Raised Over $233 Mn This Week", source: "Inc42", url: "https://inc42.com/buzz/from-navi-to-bookmyshow-indian-startups-raised-over-233-mn-this-week/", img: "https://asset.inc42.com/2026/08/Social-100-1-1.jpg" },
        { title: "Funding and acquisitions in Indian startups this week [Oct 19 – Oct 24]", source: "Entrackr", url: "https://entrackr.com/report/weekly-funding-report/funding-and-acquisitions-in-indian-startups-this-week-oct-19-oct-24-12744844", img: "https://img-cdn.publive.online/fit-in/1200x675/entrackr/media/media_files/2026/10/23/feature-image-2026-10-23-21-08-45.png" }
      ]
    },
    {
      topic: "Deep tech",
      stories: [
        { title: "DeepSeek reportedly raises $15B days after US restrictions", source: "TechCrunch", url: "https://techcrunch.com/2026/10/22/deepseek-reportedly-raises-15b-days-after-us-restrictions/", img: "https://techcrunch.com/wp-content/uploads/2025/01/deepseek-2.jpg?resize=1200,800" },
        { title: "India has changed its startup rules for deep tech", source: "TechCrunch", url: "https://techcrunch.com/2026/02/07/india-has-changed-its-startup-rules-for-deep-tech/", img: "https://techcrunch.com/wp-content/uploads/2024/02/india-space-getty.jpg?w=1200" }
      ]
    },
    {
      topic: "Motorcycles",
      stories: [
        { title: "CFMoto motorcycle sales jump 30 per cent in first half of 2026", source: "Visordown", url: "https://www.visordown.com/news/cfmoto-motorcycle-sales-jump-30-cent-first-half-2026", img: "https://www.visordown.com/sites/default/files/2026-06/cfmoto-1000-mt-x-review18.jpg?width=1600&aspect_ratio=16:9" },
        { title: "Adventure motorcycle sales “well ahead of market trend”", source: "Visordown", url: "https://www.visordown.com/news/adventure-motorcycle-sales-well-ahead-market-trend", img: "https://www.visordown.com/sites/default/files/2026-04/site-image-resize-2026-04-10t104929.813.png?width=1600&aspect_ratio=16:9" }
      ]
    }
  ];

  // Calendar snapshot from Google Calendar (next 7 days, Asia/Kolkata)
  const CALENDAR = [
    { day: "Sun 25 Oct", items: [
      { time: "9:00 PM", title: "Leave office" },
      { time: "10:00 PM", title: "Bedtime: be in bed" }
    ]},
    { day: "Mon 26 Oct", items: [
      { time: "9:00 PM", title: "Leave office" },
      { time: "10:00 PM", title: "Bedtime: be in bed" }
    ]},
    { day: "Tue 27 Oct", items: [
      { time: "9:00 PM", title: "Leave office" },
      { time: "10:00 PM", title: "Bedtime: be in bed" }
    ]},
    { day: "Wed 28 Oct", items: [
      { time: "9:00 PM", title: "Leave office" },
      { time: "10:00 PM", title: "Bedtime: be in bed" }
    ]},
    { day: "Thu 29 Oct", items: [
      { time: "9:00 PM", title: "Leave office" },
      { time: "10:00 PM", title: "Bedtime: be in bed" }
    ]}
  ];

  // Quote of the day: update every day
  const QUOTE = {
    text: "The best way to predict the future is to invent it.",
    author: "Alan Kay"
  };

  // ---- Render ----
  document.getElementById("quote").innerHTML =
    `“${QUOTE.text}” <span style="color:var(--paper);opacity:0.6;font-family:'IBM Plex Mono',monospace;font-size:12px">— ${QUOTE.author}</span>`;
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  document.getElementById("today").textContent = new Date().toLocaleDateString("en-IN", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });

  document.getElementById("news").innerHTML = NEWS.map(t => `
    <section class="topic">
      <div class="topic-label">${esc(t.topic)}</div>
      ${t.stories.map(s => `
        <a class="story" href="${esc(s.url)}" target="_blank" rel="noopener">
          ${s.img ? `<img class="story-img" src="${esc(s.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
          <div>
            <p class="story-title">${esc(s.title)}</p>
            <div class="source">${esc(s.source)}</div>
          </div>
        </a>`).join("")}
    </section>`).join("");

  document.getElementById("calendar").innerHTML = CALENDAR.map(d => `
    <div class="cal-day">${esc(d.day)}</div>
    ${d.items.map(i => `
      <div class="cal-item">
        <div class="cal-time">${esc(i.time)}</div>
        <div class="cal-title">${esc(i.title)}</div>
      </div>`).join("")}`).join("") || '<p class="empty">Nothing scheduled.</p>';
</script>
</body>
</html>
