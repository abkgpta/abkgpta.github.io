<!doctype html>
<html lang="en">
<head>

<meta name="description" content="Abhik Gupta, industrial designer. A daily page of design theory, projects and news on motorcycles, cars, deep tech and Indian startups.">

<meta property="og:title" content="Abhik Gupta — Daily">
<meta property="og:description" content="Industrial designer. Design theory, projects and the day's news on motorcycles, cars, deep tech and Indian startups.">
<meta property="og:url" content="https://abkgpta.github.io/daily/">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --black: #000000;
    --paper: #f7f2ef;
    --accent: #fb0068;
    --rule: rgba(247, 242, 239, 0.22);
    --dim: rgba(247, 242, 239, 0.6);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--black); color: var(--paper); }
  body { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; line-height: 1.55; }
  a { color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: env(safe-area-inset-top) max(24px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(24px, env(safe-area-inset-left)); }
  [hidden] { display: none !important; }

  /* Header */
  header { border-bottom: 1px solid var(--rule); padding: 40px 0 24px; display: grid; grid-template-columns: 1fr auto; gap: 16px 32px; align-items: end; }
  .brand { display: flex; gap: 24px; align-items: center; }
  .logo3d { flex: 0 0 auto; width: 220px; height: 104px; position: relative; }
  .logo3d canvas, .logo3d img { width: 100%; height: 100%; display: block; }
  .logo-fallback { object-fit: contain; filter: invert(0.95); padding: 10px; }
  @media (max-width: 600px) { .brand { flex-direction: column; align-items: flex-start; gap: 12px; } .logo3d { width: 220px; height: 104px; align-self: center; } }
  .name { font-family: "Michroma", sans-serif; font-size: 28px; font-weight: 400; margin: 0; }
  .name span { color: var(--accent); }
  .tagline { font-family: "Michroma", sans-serif; font-size: 14px; color: var(--accent); margin: 10px 0 0; max-width: 720px; }
  .tagline .by { color: var(--dim); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
  .meta { text-align: right; font-size: 12px; color: var(--dim); }
  .meta .weather { color: var(--paper); margin-top: 4px; }
  .archive-note { color: var(--accent); }
  .search { grid-column: 1 / -1; display: flex; border: 1px solid var(--rule); }
  .search input { flex: 1; background: transparent; border: 0; color: var(--paper); font: inherit; padding: 10px 12px; outline: none; }
  .search input::placeholder { color: var(--dim); }
  .search button { background: var(--accent); color: var(--black); border: 0; font: inherit; padding: 0 16px; cursor: pointer; }

  /* Layout */
  .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; padding: 32px 0 16px; }
  .full { padding: 16px 0 32px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; }
  @media (max-width: 860px) {
    .layout, .full { grid-template-columns: 1fr; }
    header { grid-template-columns: 1fr; }
    .meta { text-align: left; }
  }

  h2 { font-family: "Michroma", sans-serif; font-size: 13px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
  h2 .sub { color: var(--accent); font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.04em; text-transform: none; margin-left: 8px; }
  .block { margin-bottom: 36px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 8px; }
  .src { font-size: 11px; color: var(--dim); }
  .src a { color: var(--dim); }

  /* Now */
  .now-item { display: grid; grid-template-columns: 130px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
  .now-item:last-child { border-bottom: 0; }
  .now-name { font-family: "Michroma", sans-serif; font-size: 12px; }
  .now-note { font-size: 13px; }
  .now-date { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--accent); margin-top: 2px; }
  .hdr-updated { color: var(--accent); margin-top: 2px; }
  .week-link { display: inline-block; margin-top: 6px; color: var(--paper); font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--accent); }
  .week-link:hover { color: var(--accent); }

  /* News */
  .topic { margin-bottom: 32px; }
  .story { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 12px 0; border-bottom: 1px dashed var(--rule); }
  .story:last-child { border-bottom: 0; }
  .story-img { width: 160px; height: 100px; object-fit: cover; display: block; background: #111; }
  .story-title { font-size: 14px; margin: 0 0 4px; text-decoration: none; display: block; }
  .story-title:hover { color: var(--accent); }
  .why { font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  .story-foot { display: flex; gap: 12px; align-items: center; }
  .save { background: none; border: 1px solid var(--rule); color: var(--dim); font: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer; }
  .save:hover, .save.on { border-color: var(--accent); color: var(--accent); }
  .story.noimg { grid-template-columns: 1fr; }
  @media (max-width: 520px) {
    .story { grid-template-columns: 1fr; }
    .story-img { width: 100%; height: 180px; }
  }

  /* Aside lists */
  .row { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--accent); font-size: 12px; }
  .day { font-family: "Michroma", sans-serif; font-size: 12px; margin: 16px 0 4px; }
  .day:first-child { margin-top: 0; }
  .stat { display: flex; gap: 24px; margin-bottom: 8px; }
  .stat div { font-family: "Michroma", sans-serif; font-size: 20px; }
  .stat small { display: block; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--dim); }
  .empty { color: var(--dim); font-size: 13px; }
  .player { width: 100%; height: 152px; border: 0; border-radius: 12px; display: block; margin: 2px 0 8px; background: #111; }
  .lately { font-size: 12px; color: var(--dim); margin-top: 10px; }
  .lately b { color: var(--paper); font-weight: 400; }
  .saved-item { padding: 6px 0; border-bottom: 1px dashed var(--rule); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
  .saved-item a { text-decoration: none; }
  .saved-item a:hover { color: var(--accent); }
  .saved-item button { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 400; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); padding: 0 8px 8px 0; border-bottom: 1px solid var(--rule); }
  td { padding: 8px 8px 8px 0; border-bottom: 1px dashed var(--rule); vertical-align: top; }
  td.num { color: var(--accent); white-space: nowrap; }

  /* Learn & design */
  .term { font-family: "Michroma", sans-serif; font-size: 18px; margin: 0 0 8px; }
  .body { font-size: 13px; margin: 0 0 8px; }
  .past { margin-top: 12px; font-size: 12px; color: var(--dim); }
  .diagram { width: 100%; height: auto; display: block; margin: 4px 0 16px; }
  .design-img { width: 100%; height: 280px; object-fit: cover; display: block; margin: 4px 0 6px; background: #111; }
  .credit { font-size: 10px; color: var(--dim); margin-bottom: 14px; }
  .credit a { color: var(--dim); }

  footer { border-top: 1px solid var(--rule); padding: 20px 0 40px; font-size: 11px; color: var(--dim); }
  footer a { color: var(--dim); margin-right: 10px; }
  .lockbar { margin-top: 10px; }
  .linkish { background: none; border: 0; padding: 0; color: var(--dim); font: inherit; font-size: 11px; text-decoration: underline; cursor: pointer; }
  .linkish:hover { color: var(--accent); }
  .unlock { display: inline-flex; gap: 8px; margin-left: 12px; align-items: center; flex-wrap: wrap; }
  .unlock input { background: transparent; border: 1px solid var(--rule); color: var(--paper); font: inherit; font-size: 12px; padding: 4px 8px; }
  .unlock button { background: var(--accent); color: var(--black); border: 0; font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; }
  .lockmsg { color: var(--accent); }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo3d" id="logo3d" aria-hidden="true"><img class="logo-fallback" src="abk-logo.svg" alt=""></div>
      <div>
        <h1 class="name">ABHIK<span>GUPTA</span></h1>
        <p class="tagline" id="quote"></p>
      </div>
    </div>
    <div class="meta">
      <div id="today"></div>
      <div class="hdr-updated" id="hdrUpdated"></div>
      <a class="week-link" href="week.html">This week →</a>
      <div class="weather" id="weather"></div>
      <div class="archive-note" id="archiveNote" hidden></div>
    </div>
    <form class="search" action="search.html" method="get" role="search">
      <input name="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off">
      <button type="submit">Go</button>
    </form>
  </header>

  <div class="layout">
    <main>
      <section class="block" id="nowBlock" hidden>
        <h2>Now<span class="sub">recent projects</span></h2>
        <div id="now"></div>
      </section>
      <section id="newsBlock">
        <h2>News<span class="sub">for my interests</span></h2>
        <div id="news"></div>
      </section>
    </main>
    <aside>
      <section class="block" id="musicBlock" hidden>
        <h2>Listening<span class="sub">song of the day</span></h2>
        <div id="music"></div>
      </section>
      <section class="block" id="stravaBlock" hidden>
        <h2>Running</h2>
        <div id="strava"></div>
      </section>
      <section class="block" id="calendarBlock" hidden>
        <h2>Calendar</h2>
        <div id="calendar"></div>
      </section>
      <section class="block" id="racingBlock" hidden>
        <h2>Racing</h2>
        <div id="racing"></div>
      </section>
      <section class="block">
        <h2>Reading list<span class="sub">saved in this browser</span></h2>
        <div id="saved"></div>
      </section>
    </aside>
  </div>

  <div class="full">
    <section class="block" id="learnBlock" hidden>
      <h2>Learn today</h2>
      <div id="learn"></div>
    </section>
    <section class="block" id="designBlock" hidden>
      <h2>Design pick</h2>
      <div id="design"></div>
    </section>
    <section class="block" id="fundingBlock" hidden>
      <h2>Funding this week</h2>
      <div id="funding"></div>
    </section>
    <section class="block" id="launchesBlock" hidden>
      <h2>Upcoming launches</h2>
      <div id="launches"></div>
    </section>
  </div>

  <footer>
    <div>Headlines link to their sources. Updated <span id="updated"></span>.</div>
    <div id="archive" style="margin-top:8px"></div>
    <div id="lockbar" class="lockbar"></div>
  </footer>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const has = name => { try { return typeof eval(name) !== "undefined"; } catch (e) { return false; } };
  const get = name => (window.__PRIV && name in window.__PRIV) ? window.__PRIV[name] : (has(name) ? eval(name) : undefined);

  // ---- Private sections (calendar, running, listening) ----
  // They are published encrypted (AES-GCM, key from a passphrase via PBKDF2) and only
  // decrypted in browsers where Abhik has entered the passphrase.
  const PASS_KEY = "abhik-daily-pass";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function unseal(sealed, pass) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(sealed.salt), iterations: sealed.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(sealed.iv) }, key, b64(sealed.data));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  const readPass = () => { try { return localStorage.getItem(PASS_KEY); } catch (e) { return null; } };
  async function tryUnlock() {
    const sealed = get("PRIVATE"), pass = readPass();
    if (!sealed || !pass || !(window.crypto && crypto.subtle)) return false;
    try { window.__PRIV = await unseal(sealed, pass); return true; } catch (e) { return false; }
  }
  function lockbar(unlocked) {
    const bar = $("lockbar");
    if (!get("PRIVATE")) return;
    if (unlocked) {
      bar.replaceChildren(el("button", { class: "linkish", onclick: () => { try { localStorage.removeItem(PASS_KEY); } catch (e) {} location.reload(); } }, "Lock this browser"));
      return;
    }
    const input = el("input", { type: "password", placeholder: "Passphrase", autocomplete: "current-password", "aria-label": "Passphrase" });
    const msg = el("span", { class: "lockmsg" });
    const form = el("form", { class: "unlock", hidden: true, onsubmit: async e => {
      e.preventDefault();
      try { await unseal(get("PRIVATE"), input.value); try { localStorage.setItem(PASS_KEY, input.value); } catch (x) {} location.reload(); }
      catch (x) { msg.textContent = "That passphrase didn't work."; }
    } }, input, el("button", { type: "submit" }, "Unlock"), msg);
    bar.replaceChildren(el("button", { class: "linkish", onclick: () => { form.hidden = false; input.focus(); } }, "Owner unlock"), form);
  }

  // Small DOM helper: el("div", {class: "x"}, child, "text", ...)
  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      n.appendChild(typeof kid === "string" || typeof kid === "number" ? document.createTextNode(String(kid)) : kid);
    }
    return n;
  }
  const safeUrl = u => (typeof u === "string" && /^https:\/\//i.test(u)) ? u : null;
  const link = (u, text, cls) => safeUrl(u) ? el("a", { href: u, target: "_blank", rel: "noopener", class: cls }, text) : el("span", { class: cls }, text);
  const show = (id, nodes) => { const box = $(id); box.replaceChildren(...[].concat(nodes)); const b = $(id + "Block"); if (b) b.hidden = false; };
  const srcLine = s => s && s.name ? el("div", { class: "src" }, "Source: ", link(s.url, s.name)) : null;

  // ---- Reading list (per browser) ----
  const KEY = "abhik-daily-saved";
  const readSaved = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } };
  const writeSaved = list => { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} };
  function renderSaved() {
    const list = readSaved();
    $("saved").replaceChildren(...(list.length ? list.map((s, i) => el("div", { class: "saved-item" },
      link(s.url, s.title),
      el("button", { title: "Remove", "aria-label": "Remove", onclick: () => { const l = readSaved(); l.splice(i, 1); writeSaved(l); renderSaved(); syncSaveButtons(); } }, "×")
    )) : [el("p", { class: "empty" }, "Tap “save” on any story to keep it here.")]));
  }
  function syncSaveButtons() {
    const urls = new Set(readSaved().map(s => s.url));
    document.querySelectorAll(".save").forEach(b => { const on = urls.has(b.dataset.url); b.classList.toggle("on", on); b.textContent = on ? "saved" : "save"; });
  }
  function toggleSave(story) {
    const l = readSaved(); const i = l.findIndex(s => s.url === story.url);
    if (i >= 0) l.splice(i, 1); else l.unshift({ title: story.title, url: story.url, source: story.source });
    writeSaved(l.slice(0, 100)); renderSaved(); syncSaveButtons();
  }

  // ---- Weather (live, from Open-Meteo) ----
  const WMO = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog", 51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Rain", 63: "Rain", 65: "Heavy rain", 80: "Showers", 81: "Showers", 82: "Heavy showers", 95: "Thunderstorm", 96: "Thunderstorm", 99: "Thunderstorm" };
  function loadWeather() {
    const w = get("WEATHER_PLACE") || { name: "Ahmedabad", lat: 23.02, lon: 72.57 };
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=Asia%2FKolkata&forecast_days=1`;
    fetch(url).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
      const now = Math.round(d.current.temperature_2m), hi = Math.round(d.daily.temperature_2m_max[0]), lo = Math.round(d.daily.temperature_2m_min[0]);
      const sky = WMO[d.daily.weather_code[0]] || "", rain = d.daily.precipitation_probability_max[0];
      $("weather").textContent = `${w.name} ${now}° · ${sky} · ${hi}°/${lo}°` + (rain >= 30 ? ` · ${rain}% rain` : "");
    }).catch(() => { $("weather").textContent = ""; });
  }

  // ---- Diagrams for "Learn today" (drawn from plain data, in brand style) ----
  // { type: "layers", panels: [ { title, layers: [ { label, hl } ] } ], caption }
  // { type: "flow", steps: [ { label, note, hl } ], caption }
  const SVGNS = "http://www.w3.org/2000/svg";
  function s(tag, attrs, text) {
    const n = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
    if (text != null) n.textContent = text;
    return n;
  }
  function fitText(label, max) { label = String(label); return label.length > max ? label.slice(0, max - 1) + "…" : label; }
  function diagram(d) {
    if (!d || typeof d !== "object") return null;
    const paper = "#f7f2ef", accent = "#fb0068", dim = "rgba(247,242,239,0.35)";
    const font = "IBM Plex Mono, ui-monospace, monospace";
    let svg, W = 560;
    if (d.type === "layers" && Array.isArray(d.panels) && d.panels.length) {
      const panels = d.panels.slice(0, 3), gap = 24, pw = (W - gap * (panels.length - 1)) / panels.length;
      const rows = Math.max(...panels.map(p => (p.layers || []).length)), lh = 34, top = 30;
      const H = top + rows * (lh + 6) + (d.caption ? 24 : 4);
      svg = s("svg", { viewBox: `0 0 ${W} ${H}`, class: "diagram", role: "img", "aria-label": d.caption || "Diagram" });
      panels.forEach((p, i) => {
        const x = i * (pw + gap);
        svg.appendChild(s("text", { x, y: 16, fill: paper, "font-family": "Michroma, sans-serif", "font-size": 11 }, fitText(p.title || "", 34)));
        (p.layers || []).slice(0, 8).forEach((l, j) => {
          const y = top + j * (lh + 6);
          svg.appendChild(s("rect", { x, y, width: pw, height: lh, fill: l.hl ? "rgba(251,0,104,0.16)" : "none", stroke: l.hl ? accent : dim, "stroke-width": 1 }));
          svg.appendChild(s("text", { x: x + 10, y: y + lh / 2 + 4, fill: l.hl ? accent : paper, "font-family": font, "font-size": 11 }, fitText(l.label, Math.floor(pw / 7))));
        });
      });
      if (d.caption) svg.appendChild(s("text", { x: 0, y: H - 4, fill: dim, "font-family": font, "font-size": 10 }, fitText(d.caption, 90)));
    } else if (d.type === "flow" && Array.isArray(d.steps) && d.steps.length) {
      // step: { label: short title, note: one short line, hl: highlight }
      const steps = d.steps.slice(0, 8), narrow = window.innerWidth < 600;
      const perRow = Math.min(narrow ? 2 : 4, steps.length), gap = 26;
      const bw = (W - gap * (perRow - 1)) / perRow, bh = narrow ? 96 : 106, rowsN = Math.ceil(steps.length / perRow);
      const fs = narrow ? 15 : 11, ts = narrow ? 20 : 15, lineH = fs + 4, max = Math.floor((bw - 16) / (fs * 0.62));
      const H = rowsN * (bh + 18) + (d.caption ? 22 : 0);
      svg = s("svg", { viewBox: `0 0 ${W} ${H}`, class: "diagram", role: "img", "aria-label": d.caption || "Diagram" });
      steps.forEach((st, i) => {
        const r = Math.floor(i / perRow), c = i % perRow, x = c * (bw + gap), y = r * (bh + 18);
        svg.appendChild(s("rect", { x, y, width: bw, height: bh, fill: st.hl ? "rgba(251,0,104,0.16)" : "none", stroke: st.hl ? accent : dim }));
        svg.appendChild(s("text", { x: x + 10, y: y + ts + 8, fill: st.hl ? accent : paper, "font-family": "Michroma, sans-serif", "font-size": ts }, fitText(st.label, Math.floor((bw - 16) / (ts * 0.75)))));
        const words = String(st.note || "").split(/\s+/).filter(Boolean), lines = [""];
        words.forEach(w => { const t = (lines[lines.length - 1] + " " + w).trim(); if (t.length > max && lines[lines.length - 1]) lines.push(w); else lines[lines.length - 1] = t; });
        lines.slice(0, narrow ? 3 : 4).forEach((ln, k) => svg.appendChild(s("text", { x: x + 10, y: y + ts + 14 + (k + 1) * lineH, fill: paper, "font-family": font, "font-size": fs }, fitText(ln, max))));
        if (i < steps.length - 1 && c < perRow - 1) {
          const ax = x + bw + 4, ay = y + bh / 2;
          svg.appendChild(s("path", { d: `M${ax} ${ay} H${ax + gap - 8} M${ax + gap - 13} ${ay - 5} L${ax + gap - 8} ${ay} L${ax + gap - 13} ${ay + 5}`, stroke: accent, fill: "none" }));
        }
      });
      if (d.caption) svg.appendChild(s("text", { x: 0, y: H - 4, fill: dim, "font-family": font, "font-size": narrow ? 12 : 10 }, fitText(d.caption, narrow ? 72 : 90)));
    } else return null;
    return svg;
  }

  // ---- Render everything from the data file ----
  function render(isArchive, day) {
    $("today").textContent = new Date().toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    $("updated").textContent = get("UPDATED") || "";
    if (get("UPDATED")) $("hdrUpdated").textContent = "Last updated " + get("UPDATED");
    if (isArchive) { const n = $("archiveNote"); n.hidden = false; n.replaceChildren("Archive: " + day + " · ", el("a", { href: "./" }, "back to today")); }

    const Q = get("QUOTE");
    if (Q) $("quote").replaceChildren("“" + Q.text + "” ", el("span", { class: "by" }, "— " + Q.author));

    const NOW = get("NOW");
    if (NOW && NOW.length) show("now", NOW.map(p => el("div", { class: "now-item" },
      el("div", { class: "now-name" }, p.url ? link(p.url, p.name) : p.name, p.date ? el("div", { class: "now-date" }, p.date) : null), el("div", { class: "now-note" }, p.note))));

    const NEWS = get("NEWS") || [];
    $("news").replaceChildren(...NEWS.map(t => el("section", { class: "topic" },
      el("div", { class: "label" }, t.topic),
      ...t.stories.map(s => {
        const img = safeUrl(s.img) ? el("img", { class: "story-img", src: s.img, alt: "", loading: "lazy", referrerpolicy: "no-referrer", onerror: e => { e.target.closest(".story").classList.add("noimg"); e.target.remove(); } }) : null;
        return el("div", { class: "story" + (img ? "" : " noimg") }, img,
          el("div", {},
            link(s.url, s.title, "story-title"),
            s.why ? el("p", { class: "why" }, s.why) : null,
            el("div", { class: "story-foot" }, el("span", { class: "src" }, s.source),
              el("button", { class: "save", "data-url": s.url, onclick: () => toggleSave(s) }, "save"))));
      }))));

    const CAL = get("CALENDAR");
    if (CAL) show("calendar", CAL.length ? CAL.flatMap(d => [el("div", { class: "day" }, d.day),
      ...d.items.map(i => el("div", { class: "row" }, el("div", { class: "k" }, i.time), el("div", {}, i.title)))]) : [el("p", { class: "empty" }, "Nothing scheduled.")]);

    const R = get("RACING");
    if (R) show("racing", [
      ...(R.items || []).map(i => el("div", { class: "row" }, el("div", { class: "k" }, i.when), el("div", {}, i.what))),
      R.note ? el("p", { class: "src" }, R.note) : null, srcLine(R.source)].filter(Boolean));

    const S = get("STRAVA");
    if (S) show("strava", [
      el("div", { class: "stat" }, el("div", {}, S.runs, el("small", {}, "runs, " + S.period)), el("div", {}, S.km, el("small", {}, "km, " + S.period))),
      S.latest ? el("div", { class: "row" }, el("div", { class: "k" }, S.latest.date), el("div", {}, `${S.latest.km} km · ${S.latest.pace}/km`)) : null].filter(Boolean));

    const M = get("MUSIC");
    if (M && M.song && /^[A-Za-z0-9]{22}$/.test(M.song.id || "")) show("music", [
      el("iframe", { class: "player", src: "https://open.spotify.com/embed/track/" + M.song.id + "?theme=0", title: M.song.title + " by " + M.song.artist, allow: "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture", loading: "lazy" }),
      M.song.why ? el("p", { class: "why" }, M.song.why) : null,
      (M.playlist && safeUrl(M.playlist.url)) ? el("div", { class: "lately" }, "This week: ", link(M.playlist.url, M.playlist.name), " (opens in Spotify)") : null,
      (M.lately && M.lately.length) ? el("div", { class: "lately" }, "On repeat lately: ", el("b", {}, M.lately.join(", "))) : null].filter(Boolean));

    const L = get("LEARN");
    if (L) show("learn", [el("p", { class: "term" }, L.term), diagram(L.diagram), el("p", { class: "body" }, L.body), srcLine(L.source),
      (L.past && L.past.length) ? el("div", { class: "past" }, "Earlier: " + L.past.join(" · ")) : null].filter(Boolean));

    const D = get("DESIGN");
    if (D) show("design", [
      safeUrl(D.img) ? el("img", { class: "design-img", src: D.img, alt: D.name, loading: "lazy", referrerpolicy: "no-referrer", onerror: e => { const c = e.target.nextElementSibling; if (c && c.classList.contains("credit")) c.remove(); e.target.remove(); } }) : null,
      safeUrl(D.img) && D.imgCredit ? el("div", { class: "credit" }, "Photo: ", link(D.imgCredit.url, D.imgCredit.name)) : null,
      el("p", { class: "term" }, D.name), el("div", { class: "label" }, [D.designer, D.year].filter(Boolean).join(", ")),
      el("p", { class: "body" }, D.why), srcLine(D.source)].filter(Boolean));

    const F = get("FUNDING");
    if (F) show("funding", [
      F.summary ? el("p", { class: "body" }, F.summary) : null,
      el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Company"), el("th", {}, "Amount"), el("th", {}, "Stage"), el("th", {}, "Sector"))),
        el("tbody", {}, ...F.rounds.map(r => el("tr", {}, el("td", {}, r.company), el("td", { class: "num" }, r.amount), el("td", {}, r.stage || "—"), el("td", {}, r.sector || "—"))))),
      srcLine(F.source)].filter(Boolean));

    const LA = get("LAUNCHES");
    if (LA) show("launches", [
      el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, "Model"), el("th", {}, "Expected"), el("th", {}, "Price (est.)"))),
        el("tbody", {}, ...LA.items.map(r => el("tr", {}, el("td", {}, r.model), el("td", { class: "num" }, r.when), el("td", {}, r.price || "—"))))),
      srcLine(LA.source)].filter(Boolean));

    renderSaved(); syncSaveButtons(); loadWeather();
  }

  // ---- Archive list ----
  function renderArchive() {
    const dates = (get("ARCHIVE_DATES") || []).slice(0, 14);
    if (!dates.length) return;
    $("archive").replaceChildren("Past days: ", ...dates.map(d => el("a", { href: "?d=" + d }, d)));
  }

  function load(src, cb) { const s = document.createElement("script"); s.src = src; s.onload = cb; s.onerror = cb; document.body.appendChild(s); }
  const day = new URLSearchParams(location.search).get("d");
  const isArchive = !!(day && /^\d{4}-\d{2}-\d{2}$/.test(day));
  load(isArchive ? "archive/" + day + ".js" : "data.js", async () => {
    const unlocked = await tryUnlock();
    render(isArchive, day);
    lockbar(unlocked);
    load("archive/list.js", renderArchive);
  });
})();
</script>
<script src="logo3d.js"></script>
</body>
</html>
