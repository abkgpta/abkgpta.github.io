<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>parabuddy</title>
  <meta name="description" content="Parametric pattern generator for industrial designers. Unit-true SVG and DXF curves with matching PNG maps for Rhino, Fusion, Plasticity, Blender, SOLIDWORKS and KeyShot.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a1d'/%3E%3Cg fill='%23f2c14e'%3E%3Ccircle cx='9' cy='9' r='3'/%3E%3Ccircle cx='23' cy='9' r='3'/%3E%3Ccircle cx='16' cy='16' r='3'/%3E%3Ccircle cx='9' cy='23' r='3'/%3E%3Ccircle cx='23' cy='23' r='3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>parabuddy</div>
    <input id="docName" class="doc-name" aria-label="Pattern name" spellcheck="false">
    <label class="inline">Start from
      <select id="presetSelect"><option value="">Choose a preset…</option></select>
    </label>
    <div class="spacer"></div>
    <label class="inline seed">Seed <input id="seed" type="text" inputmode="numeric"></label>
    <button id="reseed" class="icon" title="New random seed">⟳</button>
    <button id="undo" class="icon" title="Undo (Ctrl+Z)">↶</button>
    <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)">↷</button>
    <button id="openPreset">Open</button>
    <button id="savePreset">Save</button>
    <button id="share" class="primary">Copy link</button>
    <input id="presetFile" type="file" accept=".json,application/json" hidden>
  </header>

  <div class="layout">
    <aside class="panel left" aria-label="Pattern settings">
      <details open><summary>Pattern</summary><div id="secPattern"></div></details>
      <details open><summary>Size variation</summary><div id="secVariation"></div></details>
      <details open><summary>Panel</summary><div id="secPanel"></div></details>
      <details><summary>Keep-out zones</summary><div id="secKeepouts"></div></details>
      <details open><summary>Process rules</summary><div id="secProcess"></div></details>
    </aside>

    <main class="stage">
      <canvas id="view" aria-label="Pattern preview"></canvas>
      <div class="tools">
        <button id="fit" title="Fit to view (F)">Fit</button>
        <button id="oneToOne" title="Show at approximately real size">1:1</button>
        <label class="inline"><input id="showIssues" type="checkbox" checked> Show issues</label>
      </div>
      <div id="tip" class="tip" hidden></div>
      <div class="status"><span id="statusDims"></span><span id="statusCursor"></span><span id="statusTime"></span></div>
    </main>

    <aside class="panel right" aria-label="Metrics and export">
      <section><h2>Metrics</h2><dl id="metrics" class="metrics"></dl></section>
      <section><h2>Checks</h2><ul id="checks" class="checks"></ul></section>
      <section><h2>Export</h2><div id="secExport"></div></section>
    </aside>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
