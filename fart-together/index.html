<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fart Together</title>
<style>
  :root {
    --ink: #2b1d0e;
    --paper: #fff8e7;
    --accent: #7bb33a;
    --accent-dark: #4d7a1c;
    --muted: #8a7a63;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4f8f42; font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #panel {
    position: fixed; top: 16px; left: 16px; width: 320px; max-width: calc(100vw - 32px);
    max-height: calc(100vh - 32px); overflow: auto;
    background: var(--paper); border: 3px solid var(--ink); border-radius: 16px;
    box-shadow: 6px 6px 0 rgba(43, 29, 14, .35); padding: 16px 18px;
  }
  #panel.hidden { display: none; }
  h1 { margin: 0; font-size: 30px; line-height: 1; letter-spacing: -1px; }
  h1 span { color: var(--accent-dark); }
  .sub { margin: 4px 0 12px; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); }
  button { font: inherit; font-weight: bold; font-size: 15px; padding: 8px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  button.ghost { background: #fff; color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  ul { list-style: none; padding: 0; margin: 8px 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 15px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .tag { margin-left: auto; font-size: 12px; color: var(--muted); }
  .help { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: 10px; }
  .help b { color: var(--ink); }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--muted); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; color: var(--ink); }
  .mode { font-size: 12px; padding: 6px 8px; border-radius: 8px; background: #efe5cc; margin-bottom: 8px; }
  #hideBtn { position: absolute; top: 10px; right: 10px; padding: 2px 8px; font-size: 12px; box-shadow: none; }
  #showBtn { position: fixed; top: 16px; left: 16px; display: none; }

  #touch { position: fixed; inset: auto 0 0 0; display: none; justify-content: space-between; align-items: flex-end; padding: 0 16px 20px; pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  #touch button { width: 76px; height: 76px; border-radius: 50%; font-size: 26px; background: rgba(255, 248, 231, .85); color: var(--ink); }
  #touch #tFart { width: 110px; height: 110px; font-size: 20px; background: rgba(123, 179, 58, .9); color: #fff; }
  #touch button.on { transform: translate(2px, 2px); box-shadow: none; filter: brightness(.9); }
  body.touch #touch { display: flex; }

  @media (max-width: 560px) {
    #panel { top: 8px; left: 8px; right: 8px; width: auto; max-width: none; max-height: 60vh; padding: 12px 14px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <button id="hideBtn" class="ghost" title="Hide (Tab)">hide</button>
  <h1>Fart <span>Together</span></h1>
  <p class="sub">One boat. Up to four bottoms. Get upstream.</p>
  <div id="modeNote" class="mode">Connecting…</div>

  <div id="joinBox" style="display:none">
    <div class="row">
      <input id="nameInput" type="text" maxlength="16" placeholder="Your name" autocomplete="off">
      <button id="joinBtn">Join</button>
    </div>
  </div>

  <div id="localBox" style="display:none">
    <div class="row">
      <button id="addLocalBtn" class="ghost">+ Add player</button>
      <button id="removeLocalBtn" class="ghost">– Remove</button>
    </div>
  </div>

  <ul id="playerList"></ul>

  <div class="row">
    <button id="startBtn">Start race</button>
    <button id="riverBtn" class="ghost">New river</button>
  </div>

  <div class="help" id="help"></div>
</div>
<button id="showBtn" class="ghost">menu</button>

<div id="touch">
  <div class="grp">
    <button id="tLeft" aria-label="Aim left">⟲</button>
    <button id="tRight" aria-label="Aim right">⟳</button>
  </div>
  <div class="grp">
    <button id="tFart">FART</button>
  </div>
</div>

<script src="game.js"></script>
<script src="client.js"></script>
</body>
</html>
